<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="60%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#090C16"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes wave-pulse {
      0% { opacity: 0.1; transform: scale(0.9); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.1; transform: scale(0.9); }
    }
    @keyframes cursor-wander {
      0%, 100% { transform: translate(960px, 120px); }
      30% { transform: translate(1040px, 80px); }
      60% { transform: translate(990px, 170px); }
      85% { transform: translate(920px, 110px); }
    }
    @keyframes spring-touch {
      0%, 100% { r: 6px; opacity: 0.9; }
      50% { r: 18px; opacity: 0.2; }
    }
    .wave1 { animation: wave-pulse 2.5s ease-in-out infinite; transform-origin: 820px 140px; }
    .wave2 { animation: wave-pulse 2.5s ease-in-out infinite 0.6s; transform-origin: 820px 140px; }
    .cursor-desk { animation: cursor-wander 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .touch-dot { animation: spring-touch 1.8s ease-out infinite; }
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    .font-mono { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; }
  </style>

  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#bg2)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#glowGreen)"/>
  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#glowBlue)"/>

  <!-- Left Content -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="165" height="26" rx="13" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="13" cy="13" r="3.5" fill="#34D399"/>
    <text x="24" y="17" fill="#6EE7B7" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.2">SYSTEM PROTOCOLS</text>

    <text x="0" y="72" fill="#FFFFFF" font-size="44" class="font-title">MOU<tspan fill="#34D399">Set</tspan> (mousely)</text>
    <text x="0" y="112" fill="#94A3B8" font-size="16" class="font-title">Zero-Install Mobile Presentation Clicker &amp; Multi-Touch Trackpad</text>

    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="19" fill="#34D399" font-size="12" font-weight="700" class="font-mono">WS RFC 6455</text>

      <rect x="160" y="0" width="145" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="172" y="19" fill="#38BDF8" font-size="12" font-weight="700" class="font-mono">&lt; 5MS LATENCY</text>

      <rect x="315" y="0" width="145" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="327" y="19" fill="#F472B6" font-size="12" font-weight="700" class="font-mono">ZERO INSTALL</text>
    </g>
  </g>

  <!-- Right Phone & PC Bridge Visual -->
  <g>
    <!-- Smartphone Shell -->
    <g transform="translate(730, 48)">
      <rect width="90" height="180" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <rect x="6" y="14" width="78" height="152" rx="12" fill="#020617"/>
      <!-- Trackpad Area -->
      <rect x="12" y="32" width="66" height="95" rx="8" fill="#1E293B" stroke="#059669" stroke-dasharray="3 3"/>
      <circle cx="45" cy="80" class="touch-dot" fill="#34D399"/>
      <circle cx="45" cy="80" r="5" fill="#34D399"/>
      <!-- Nav Buttons -->
      <circle cx="30" cy="145" r="8" fill="#1E293B"/>
      <text x="27" y="148" fill="#94A3B8" font-size="9" font-weight="bold">‹</text>
      <circle cx="60" cy="145" r="8" fill="#1E293B"/>
      <text x="57" y="148" fill="#94A3B8" font-size="9" font-weight="bold">›</text>
    </g>

    <!-- Radiating WebSocket Waves -->
    <g>
      <path class="wave1" d="M 835 125 A 25 25 0 0 1 835 155" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
      <path class="wave2" d="M 845 115 A 40 40 0 0 1 845 165" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Desktop Screen Shell -->
    <g transform="translate(880, 58)">
      <rect width="210" height="145" rx="10" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="10" y="12" width="190" height="120" rx="6" fill="#020617"/>
      <line x1="88" y1="145" x2="122" y2="145" stroke="#38BDF8" stroke-width="6"/>
      <rect x="98" y="145" width="14" height="22" fill="#1E293B"/>
      <rect x="80" y="167" width="50" height="5" rx="2" fill="#334155"/>
    </g>

    <!-- Smooth Wandering Cursor on Desktop -->
    <g class="cursor-desk">
      <polygon points="0,0 0,16 5,12 9,20 12,18 8,11 15,11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1"/>
    </g>
  </g>
</svg>